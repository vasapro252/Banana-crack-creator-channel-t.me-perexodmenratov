<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicPro Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      padding: 16px;
      min-height: 100vh;
    }
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; }
    h2 {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #757575;
      padding: 8px 0 8px;
    }
    .lang-switch { display: flex; gap: 6px; flex-shrink: 0; }
    .lang-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #bdbdbd;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #4caf50;
      border-color: #4caf50;
      color: #fff;
    }
    .error {
      display: none;
      background: #3e2723;
      color: #ffab91;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #2c2c2c;
      gap: 12px;
    }
    .row:last-child { border-bottom: none; }
    .row-label { font-size: 0.95rem; font-weight: 500; flex: 1; min-width: 0; }
    .row-sub { font-size: 0.75rem; color: #757575; margin-top: 2px; }
    .toggle { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      display: block;
      width: 48px;
      height: 28px;
      background: #424242;
      border-radius: 28px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: #4caf50; }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
    .hint {
      font-size: 0.8rem;
      color: #757575;
      line-height: 1.5;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>MagicPro</h1>
    <div class="lang-switch">
      <button type="button" class="lang-btn" id="lang-en">EN</button>
      <button type="button" class="lang-btn active" id="lang-zh">中文</button>
      <button type="button" class="lang-btn" id="lang-ru">RU</button>
    </div>
  </div>
  <div class="error" id="error"></div>

  <h2 data-i18n="sec_injection">Injection</h2>
  <div class="card" id="inject-card"></div>
  <p class="hint" data-i18n="hint_injection">Toggle which game packages should be injected. Changes save automatically.</p>

  <script type="module">
    const DEFAULT_MOD_PATH = '/data/adb/modules/MagicPro/inject.conf';
    const EXEC_ENV = { PATH: '/data/adb/ksu/bin:/system/bin:/system/xbin:/vendor/bin' };
    const LANG_KEY = 'magicpro_lang';

    const I18N = {
      en: {
        page_title: 'MagicPro Settings',
        sec_injection: 'Injection',
        hint_injection: 'Toggle which game packages should be injected. Changes save automatically.',
        err_webui: 'Open this page from KernelSU / Magisk module WebUI.',
        err_kernelsu: 'Failed to load kernelsu.js: {msg}',
        toast_inject_saved: 'Saved',
        err_inject_write: 'Failed to write inject.conf: {detail}',
        server_gl: 'Global (GL)',
        server_kr: 'Korea (KR)',
        server_tw: 'Taiwan (TW)',
        server_vng: 'Vietnam (VNG)'
      },
      zh: {
        page_title: 'MagicPro 设置',
        sec_injection: '注入',
        hint_injection: '选择需要注入的游戏包，修改后会自动保存。',
        err_webui: '请通过 KernelSU / Magisk 模块 WebUI 打开本页。',
        err_kernelsu: '无法加载 kernelsu.js：{msg}',
        toast_inject_saved: '已保存',
        err_inject_write: '无法写入 inject.conf：{detail}',
        server_gl: '国际服 (GL)',
        server_kr: '韩服 (KR)',
        server_tw: '台服 (TW)',
        server_vng: '越南服 (VNG)'
      },
      ru: {
        page_title: 'MagicPro — Настройки',
        sec_injection: 'Инъекция',
        hint_injection: 'Выберите пакеты для инъекции. Изменения сохраняются автоматически.',
        err_webui: 'Откройте страницу через WebUI модуля KernelSU / Magisk.',
        err_kernelsu: 'Не удалось загрузить kernelsu.js: {msg}',
        toast_inject_saved: 'Сохранено',
        err_inject_write: 'Не удалось записать inject.conf: {detail}',
        server_gl: 'Глобальная (GL)',
        server_kr: 'Корея (KR)',
        server_tw: 'Тайвань (TW)',
        server_vng: 'Вьетнам (VNG)'
      }
    };

    let lang = localStorage.getItem(LANG_KEY) || 'zh';
    if (lang !== 'en' && lang !== 'zh' && lang !== 'ru') lang = 'zh';

    const SERVERS = [
      { key: 'com.tencent.ig', nameKey: 'server_gl', pkg: 'com.tencent.ig' },
      { key: 'com.pubg.krmobile', nameKey: 'server_kr', pkg: 'com.pubg.krmobile' },
      { key: 'com.rekoo.pubgm', nameKey: 'server_tw', pkg: 'com.rekoo.pubgm' },
      { key: 'com.vng.pubgmobile', nameKey: 'server_vng', pkg: 'com.vng.pubgmobile' }
    ];

    const errorEl = document.getElementById('error');
    const langEnBtn = document.getElementById('lang-en');
    const langZhBtn = document.getElementById('lang-zh');
    const langRuBtn = document.getElementById('lang-ru');

    let saving = false;
    let execFn = null;
    let toastFn = null;
    let modPath = DEFAULT_MOD_PATH;
    const injectRows = [];
    const injectInputs = [];

    function t(key, vars = {}) {
      let text = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
      for (const [k, v] of Object.entries(vars)) {
        text = text.replace(`{${k}}`, v);
      }
      return text;
    }

    function applyLang() {
      document.documentElement.lang = lang === 'ru' ? 'ru' : (lang === 'zh' ? 'zh-CN' : 'en');
      document.title = t('page_title');
      langEnBtn.classList.toggle('active', lang === 'en');
      langZhBtn.classList.toggle('active', lang === 'zh');
      langRuBtn.classList.toggle('active', lang === 'ru');
      for (const el of document.querySelectorAll('[data-i18n]')) {
        el.textContent = t(el.dataset.i18n);
      }
      for (const row of injectRows) {
        row.labelEl.textContent = t(row.nameKey);
      }
    }

    function setLang(next) {
      if (next !== 'en' && next !== 'zh' && next !== 'ru') return;
      lang = next;
      localStorage.setItem(LANG_KEY, lang);
      applyLang();
    }

    langEnBtn.addEventListener('click', () => setLang('en'));
    langZhBtn.addEventListener('click', () => setLang('zh'));
    langRuBtn.addEventListener('click', () => setLang('ru'));

    function showError(msg) {
      errorEl.style.display = 'block';
      errorEl.textContent = msg;
    }

    function makeToggleRow(labelKey, sub, dataKey, checked) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div>
          <div class="row-label"></div>
          ${sub ? `<div class="row-sub">${sub}</div>` : ''}
        </div>
        <label class="toggle">
          <input type="checkbox" data-key="${dataKey}" ${checked ? 'checked' : ''}>
          <span class="slider"></span>
        </label>`;
      const labelEl = row.querySelector('.row-label');
      labelEl.textContent = t(labelKey);
      const input = row.querySelector('input');
      injectInputs.push(input);
      injectRows.push({ labelEl, nameKey: labelKey });
      return row;
    }

    function buildUi() {
      const injectCard = document.getElementById('inject-card');
      for (const s of SERVERS) {
        injectCard.appendChild(makeToggleRow(s.nameKey, s.pkg, s.key, true));
      }
    }

    buildUi();
    applyLang();

    function parseKeyValue(text) {
      const map = {};
      for (const line of (text || '').split('\n')) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;
        const eq = trimmed.indexOf('=');
        if (eq < 0) continue;
        map[trimmed.slice(0, eq).trim()] = trimmed.slice(eq + 1).trim();
      }
      return map;
    }

    function parseInjectConfig(text) {
      const map = parseKeyValue(text);
      const out = {};
      for (const s of SERVERS) out[s.key] = map[s.key] !== '0';
      return out;
    }

    function applyInject(map) {
      for (const input of injectInputs) {
        input.checked = map[input.dataset.key] !== false;
      }
    }

    function buildInjectConfig() {
      return SERVERS.map(s => {
        const input = injectInputs.find(i => i.dataset.key === s.key);
        return `${s.key}=${input && input.checked ? 1 : 0}`;
      }).join('\n') + '\n';
    }

    function utf8ToBase64(text) {
      const bytes = new TextEncoder().encode(text);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function shellQuote(value) {
      return `'${String(value).replace(/'/g, `'\\''`)}'`;
    }

    async function writeConfigFileTo(content, path) {
      const b64 = utf8ToBase64(content);
      const attempts = [
        `sh -c 'echo ${b64} | base64 -d > ${path}'`,
        `sh -c 'echo ${b64} | busybox base64 -d > ${path}'`,
        `sh -c 'echo ${b64} | /data/adb/ksu/bin/busybox base64 -d > ${path}'`,
      ];
      let last = { errno: 1, stdout: '', stderr: 'unknown error' };
      for (const cmd of attempts) {
        last = await execFn(cmd, { env: EXEC_ENV });
        if (last.errno === 0) {
          await execFn(`chmod 644 ${shellQuote(path)}`, { env: EXEC_ENV });
          return last;
        }
      }
      return last;
    }

    function resolvePath(moduleInfoFn, fileName, fallback) {
      try {
        const info = JSON.parse(moduleInfoFn());
        if (info && info.moduleDir) return `${info.moduleDir}/${fileName}`;
      } catch (_) {}
      return fallback;
    }

    async function loadInject() {
      if (!execFn) return;
      const { errno, stdout } = await execFn(`cat ${shellQuote(modPath)} 2>/dev/null`, { env: EXEC_ENV });
      if (errno !== 0) return;
      applyInject(parseInjectConfig(stdout || ''));
    }

    async function saveInject() {
      if (!execFn || saving) return;
      saving = true;
      errorEl.style.display = 'none';
      const result = await writeConfigFileTo(buildInjectConfig(), modPath);
      saving = false;
      if (result.errno === 0) {
        if (toastFn) toastFn(t('toast_inject_saved'));
      } else {
        showError(t('err_inject_write', { detail: (result.stderr || result.stdout || '').trim() }));
      }
    }

    for (const input of injectInputs) {
      input.addEventListener('change', saveInject);
    }

    (async () => {
      try {
        const ksuApi = await import('./kernelsu.js');
        execFn = ksuApi.exec;
        toastFn = ksuApi.toast;
        modPath = resolvePath(ksuApi.moduleInfo, 'inject.conf', DEFAULT_MOD_PATH);
        if (typeof ksu === 'undefined') {
          showError(t('err_webui'));
          return;
        }
        await loadInject();
      } catch (e) {
        showError(t('err_kernelsu', { msg: e && e.message ? e.message : String(e) }));
      }
    })();
  </script>
</body>
</html>
